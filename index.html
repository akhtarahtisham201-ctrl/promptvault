<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070912">
<meta name="description" content="PromptVault — browse, copy and save AI image prompts.">
<title>PromptVault — AI Image Prompts</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#070912;--panel:#101524;--panel2:#0b1020;--line:#27334c;--blue:#175dff;--purple:#713cff;--text:#f5f7ff;--muted:#aeb8d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#080b14ed;backdrop-filter:blur(14px);border-bottom:1px solid #222b40;padding:12px 14px;display:flex;align-items:center;gap:12px}
.brand{font-size:clamp(21px,5vw,30px);font-weight:850;letter-spacing:-1px;white-space:nowrap}.brand span{color:#8460ff}
.menu{border:0;background:transparent;color:white;font-size:27px;padding:4px 8px}.pro{margin-left:auto;border:0;border-radius:30px;padding:10px 14px;color:white;background:linear-gradient(110deg,#7b2cff,#174dff);font-weight:800}
.searchrow{padding:16px 14px 8px}.searchrow input{width:100%;padding:14px 16px;border:1px solid #334263;border-radius:16px;background:#0e1424;color:white;font-size:16px;outline:none}
.hero{margin:10px 14px 16px;border:1px solid #293b68;border-radius:24px;padding:20px;background:radial-gradient(circle at 85% 20%,#203d78 0,transparent 40%),linear-gradient(130deg,#15162d,#0a1020)}
.pill{display:inline-block;background:#3d248f;border-radius:30px;padding:7px 12px;font-weight:750;font-size:12px}.hero h1{font-size:clamp(27px,7vw,39px);line-height:1.12;margin:14px 0 8px}.hero p{color:#c2cbe0;margin:0 0 12px}
.filters{display:flex;gap:9px;overflow-x:auto;padding:10px 14px 16px;scrollbar-width:none}.filters button,.bottom button{flex:0 0 auto;border:1px solid #303a51;border-radius:30px;background:#101522;color:#dce3f7;padding:11px 17px;font-weight:750;font-size:14px}.filters button.active,.bottom button.active{background:linear-gradient(110deg,#214cff,#743cff);border-color:transparent;color:white}
.sectiontitle{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 12px}.sectiontitle h2{font-size:22px;margin:0}.sectiontitle small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 12px 100px}
.card{min-width:0;background:#0d1220;border:2px solid #175dff;border-radius:17px;overflow:hidden;box-shadow:0 0 8px #174dff22}
.thumb{position:relative;aspect-ratio:4/4.7;background:#111;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.heart{position:absolute;right:8px;top:8px;width:36px;height:36px;border:1px solid #ffffff70;border-radius:50%;background:#111a;color:white;font-size:21px}.heart.on{color:#ff5b9b}
.cardbody{padding:11px}.tag{font-size:11px;color:#bfcaff;background:#222d48;border-radius:20px;padding:4px 8px;display:inline-block}.card h3{font-size:15px;line-height:1.25;margin:9px 0 7px}.preview{font-size:12px;color:#aeb8d0;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:52px}
.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1;border:0;border-radius:10px;padding:10px 6px;background:#214dff;color:white;font-weight:750}.actions .view{background:#20283a;color:#e8edff}
.bottom{position:fixed;z-index:6;bottom:0;left:0;right:0;display:flex;gap:7px;overflow-x:auto;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#080b14f2;border-top:1px solid #26314a;scrollbar-width:none}.bottom button{padding:11px 13px}
.empty{padding:25px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-height:88vh;overflow:auto;background:#101524;border:1px solid #35405b;border-radius:24px 24px 0 0;padding:20px}.sheet h2{margin-top:0}.sheet p{color:#d1d9eb;line-height:1.6;white-space:pre-wrap}.sheet button{border:0;border-radius:12px;background:#2756ff;color:white;padding:13px 16px;font-weight:800}.close{float:right;background:#252d40!important}
footer{padding:15px;text-align:center;color:#7f8ba8;font-size:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));padding-left:20px;padding-right:20px}.hero,.searchrow{margin-left:20px;margin-right:20px}.filters{padding-left:20px}.sectiontitle{padding-left:20px;padding-right:20px}}
</style>
</head>
<body>
<header><button class="menu" id="menu" aria-label="Open menu">☰</button><div class="brand">Prompt<span>Vault</span></div><button class="pro" id="pro">♛ PRO</button></header>
<section class="hero"><span class="pill">✦ 300 AI PROMPT IDEAS</span><h1>Discover. Copy. Create.</h1><p>Portraits, fashion, romantic couples and cute baby styles.</p></section>
<div class="searchrow"><input id="search" type="search" placeholder="Search prompts, styles, poses…"></div>
<nav class="filters" id="filters">
<button class="active" data-cat="All">All</button><button data-cat="Boys / Men">Boys / Men</button><button data-cat="Girls / Women">Girls / Women</button><button data-cat="Couples">Couples</button><button data-cat="Baby">Baby</button><button data-cat="Trending">Trending</button><button data-cat="Favorites">♡ Favorites</button>
</nav>
<div class="sectiontitle"><h2 id="heading">Trending Prompts</h2><small id="count">300 prompts</small></div>
<main class="grid" id="grid"></main>
<footer>PromptVault · Save your favorite ideas and copy prompts for your preferred AI image tool.</footer>
<nav class="bottom" id="bottom"><button class="active" data-cat="All">All</button><button data-cat="Trending">♨ Trending</button><button data-cat="Boys / Men">Men</button><button data-cat="Girls / Women">Women</button><button data-cat="Couples">♡ Couple</button><button data-cat="Baby">♧ Baby</button><button data-cat="Favorites">♡ Favorites</button></nav>
<div class="modal" id="modal"><div class="sheet"><button class="close" id="close">Close ✕</button><h2 id="modalTitle">Prompt</h2><p id="modalText"></p><button id="copyModal">Copy prompt</button></div></div>
<script>
const prompts = [
{"id": 1, "title": "Ahtasham Warm Lantern Glow", "category": "Boys / Men", "prompt": "Create a photorealistic cinematic portrait of Ahtasham wearing a black shalwar kameez. He is indoors with a warm glowing lantern in the background. Shallow depth of field, sharp focus on the face, highly detailed.", "image": "photo_01.png"},
  {"id": 2, "title": "Ahtasham Confident Modern Steps", "category": "Boys / Men", "prompt": "A high-quality portrait of Ahtasham wearing a black polo shirt and white trousers, sitting confidently on modern outdoor steps. Bright daylight, crisp details, photorealistic.", "image": "photo_02.png"},
  {"id": 3, "title": "Ahtasham Cozy Cafe Vibes", "category": "Boys / Men", "prompt": "A modern portrait of Ahtasham in a white Nike hoodie, relaxing at a cozy cafe. In the background, a neon sign reads 'Good Vibes Only'. Evening lighting, stylish and cinematic.", "image": "photo_03.png"},
  {"id": 4, "title": "Ahtasham Relaxed Garden Look", "category": "Boys / Men", "prompt": "A photorealistic portrait of Ahtasham wearing a black denim jacket over a white t-shirt, sitting relaxed in a garden setting with a lantern behind him. Natural lighting, crisp focus.", "image": "photo_04.png"},
  {"id": 5, "title": "Ahtasham White Hoodie Thoughtful", "category": "Boys / Men", "prompt": "A detailed close-up portrait of Ahtasham in a white Nike hoodie, looking thoughtful outdoors in a garden setting. Soft sunlight highlighting his face, beautiful bokeh.", "image": "photo_05.png"},
  {"id": 6, "title": "Ahtasham Serene Waterfall Look", "category": "Boys / Men", "prompt": "A stunning outdoor portrait of Ahtasham wearing a dark green shirt and white trousers, sitting calmly in front of a beautiful cascading waterfall with turquoise waters. Photorealistic nature photography.", "image": "photo_06.png"},
  {"id": 7, "title": "Ahtasham Waterfall Welcome", "category": "Boys / Men", "prompt": "A vibrant photo of Ahtasham standing in front of a scenic waterfall with his arms open in a welcoming pose. He is wearing a dark green open shirt over a white t-shirt. High resolution, bright natural lighting.", "image": "photo_07.png"},
  {"id": 8, "title": "Ahtasham Burgundy Blazer Style", "category": "Boys / Men", "prompt": "An elegant outdoor portrait of Ahtasham wearing a stylish burgundy blazer with a chain brooch over a black shirt. He is resting his chin on his hand, looking sharp. Natural daylight, 8k resolution.", "image": "photo_08.png"},
  {"id": 9, "title": "Ahtasham Romantic Garden Couple", "category": "Couples", "prompt": "A beautiful romantic portrait of Ahtasham and a young woman sitting together in a garden. The woman is wearing a black embroidered dress. Soft evening light, vibrant pink flowers in the background, photorealistic style.", "image": "photo_09.png"},
{"id": 10, "title": "Ahtasham Cafe Good Vibes", "category": "Boys / Men", "prompt": "A modern, photorealistic portrait of Ahtasham wearing a black Nike hoodie, sitting outdoors at a cafe. He is holding a black mug with 'Good Vibes' printed in gold. In the background, a chalkboard sign reads 'Tea Makes Everything Better'. Bright daylight, crisp focus.", "image": "photo_10.png"},
  {"id": 11, "title": "Ahtasham & Girl Ice Cream Date", "category": "Couples", "prompt": "A beautiful romantic portrait of Ahtasham and a young woman sitting together outdoors, both eating chocolate-drizzled ice cream cones. Ahtasham is wearing a black polo shirt, and the woman is wearing a black embroidered dress. Soft natural daylight, photorealistic style, vibrant background.", "image": "photo_11.png"},
 {"id": 12, "title": "Ahtasham Sweet Ice Cream Moment", "category": "Couples", "prompt": "A beautiful romantic photorealistic portrait of Ahtasham and a young woman sitting together on outdoor steps. Ahtasham is playfully feeding a chocolate-drizzled ice cream cone to the woman. Both are wearing elegant black outfits. Bright natural daylight, vibrant flowers in the background, sharp focus.", "image": "photo_12.png"},
{"id": 13, "title": "Ahtasham Football Lovers Poster", "category": "Boys / Men", "prompt": "Create an ultra-realistic, premium football-themed cinematic poster featuring the exact same young man from the uploaded reference photograph. Preserve his original facial identity with maximum accuracy, including his face shape, eyes, eyebrows, nose, lips, natural hairstyle, skin tone and thin moustache. Do not change or beautify his facial features. The young man is wearing a stylish black football jersey with elegant golden details, sitting confidently with one hand resting against his cheek and a professional football positioned in the foreground. Create a dramatic artistic composition with a large monochrome portrait of the same person in the background. Use a dark textured stadium background, vintage grunge effects, golden paint splashes, football player silhouette, hand-drawn crown and subtle football graphics. Add large bold typography at the top reading 'FOOTBALL LOVERS' in distressed white and golden-yellow lettering. Add the slogan 'PLAY FOOTBALL, BE HAPPY' in elegant handwritten typography. Professional graphic design, cinematic lighting, realistic skin texture, sharp facial details, luxury editorial poster aesthetic, balanced composition, premium social media artwork, ultra-detailed, 4K HD, portrait 3:4 aspect ratio.", "image": "photo_13.png"},
{"id": 14, "title": "Golden Hour – Beach Sunset Vibes", "category": "Boys / Men", "prompt": "Create an ultra-realistic cinematic beach sunset portrait using the uploaded reference photo. Preserve the subject's identity and natural appearance. Show him standing on wet beach sand, facing the ocean, wearing a clean white shirt, blue jeans and white sneakers. Hands casually placed behind his back. Create a breathtaking sunset with vibrant orange, pink and deep blue clouds, gentle ocean waves, distant boats and beautiful reflections on wet sand. Professional DSLR photography, cinematic color grading, realistic lighting, premium travel photography, sharp details, 4K HD, portrait 3:4 ratio.", "image": "photo_14.png"},
{"id": 15, "title": "Peaceful Moments – Feeding Pigeons 🕊️", "category": "Boys / Men", "prompt": "Create an ultra-realistic cinematic portrait using the uploaded reference photo of the young man. Preserve his original face and identity with maximum accuracy, including the same face shape, eyes, eyebrows, nose, lips, natural black hairstyle, skin tone and light moustache. Do not alter his facial features or make him look older. Show him sitting comfortably on a beautiful stone bench in a grand mosque courtyard, wearing an elegant black traditional shalwar kameez and a stylish silver wristwatch. He is gently feeding pigeons from his hands while several beautiful pigeons fly around him and gather on the ground. In the background, create beautiful golden mosque domes, elegant minarets, soft sunlight, blurred visitors and a peaceful spiritual atmosphere. Professional DSLR photography, warm golden-hour lighting, realistic skin texture, natural body proportions suitable for a 16–17-year-old, cinematic depth of field, premium color grading, incredibly detailed, 4K HD, portrait 3:4 composition.", "image": "photo_15.png"}];
  let category = "All", query = "", favorites = new Set();
try { favorites = new Set(JSON.parse(localStorage.getItem("pv-favorites") || "[]")); } catch(e){}
const grid=document.getElementById("grid"), count=document.getElementById("count"), heading=document.getElementById("heading");
let selected=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function shown(){
 let arr=prompts.filter(p=>{
  const matchCat=category==="All"||category==="Trending"|| (category==="Favorites"?favorites.has(p.id):p.category===category);
  const q=query.toLowerCase();
  return matchCat && (!q||(p.title+" "+p.category+" "+p.prompt).toLowerCase().includes(q));
 });
 if(category==="Trending") arr=arr.slice().sort((a,b)=>((b.id%17)-(a.id%17)));
 return arr;
}
function render(){
 const arr=shown();count.textContent=arr.length+" prompts";heading.textContent=category==="All"?"All Prompts":category==="Trending"?"Trending Prompts":category==="Favorites"?"Your Favorites":category+" Prompts";
 grid.innerHTML=arr.map(p=>`<article class="card"><div class="thumb"><img loading="lazy" src="${esc(p.image)}" alt="${esc(p.title)}"><button class="heart ${favorites.has(p.id)?"on":""}" data-heart="${p.id}" aria-label="Favorite">${favorites.has(p.id)?"♥":"♡"}</button></div><div class="cardbody"><span class="tag">${esc(p.category)}</span><h3>${esc(p.title)}</h3><div class="preview">${esc(p.prompt)}</div><div class="actions"><button data-copy="${p.id}">Copy prompt</button><button class="view" data-view="${p.id}">View</button></div></div></article>`).join("")||'<div class="empty">No prompts found. Try another search or category.</div>';
}
function setCat(cat){category=cat;document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("active",b.dataset.cat===cat));render();}
document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>setCat(b.dataset.cat)));
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render();});
async function copyPrompt(p){try{await navigator.clipboard.writeText(p.prompt);alert("Prompt copied! Paste it into your AI image tool.");}catch(e){showPrompt(p);}}
function showPrompt(p){selected=p;document.getElementById("modalTitle").textContent=p.title;document.getElementById("modalText").textContent=p.prompt;document.getElementById("modal").classList.add("open");}
grid.addEventListener("click",e=>{
 const heart=e.target.closest("[data-heart]");if(heart){const id=Number(heart.dataset.heart);favorites.has(id)?favorites.delete(id):favorites.add(id);localStorage.setItem("pv-favorites",JSON.stringify([...favorites]));render();return;}
 const copy=e.target.closest("[data-copy]");if(copy){const p=prompts.find(x=>x.id===Number(copy.dataset.copy));if(p)copyPrompt(p);return;}
 const view=e.target.closest("[data-view]");if(view){const p=prompts.find(x=>x.id===Number(view.dataset.view));if(p)showPrompt(p);}
});
document.getElementById("close").onclick=()=>document.getElementById("modal").classList.remove("open");
document.getElementById("copyModal").onclick=()=>selected&&copyPrompt(selected);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")e.currentTarget.classList.remove("open");});
document.getElementById("menu").onclick=()=>{document.getElementById("search").focus();window.scrollTo({top:0,behavior:"smooth"});};
document.getElementById("pro").onclick=()=>alert("PromptVault PRO — premium features can be added in a future version.");
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body></html>
